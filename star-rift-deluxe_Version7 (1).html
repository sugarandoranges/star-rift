<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#070b18">
  <title>星际拾光：裂隙远征</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070b18;
      color: #eef5ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body { display: grid; place-items: center; }
    .wrap {
      position: relative;
      width: min(96vw, 1000px);
      border: 1px solid #8195cc55;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px #000a, 0 0 48px #4278ff22;
      background: #080d1b;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1000 / 625;
      touch-action: none;
      user-select: none;
    }
    #dash {
      position: absolute;
      right: 16px;
      bottom: 20px;
      width: 66px;
      height: 66px;
      border: 1px solid #8deaffaa;
      border-radius: 50%;
      color: #e8fbff;
      background: #14324dcc;
      box-shadow: 0 0 20px #38dfff55;
      font: 700 13px system-ui;
      touch-action: manipulation;
    }
    .help {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      color: #c4d2ec99;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <canvas id="game" width="1000" height="625" aria-label="星际拾光：裂隙远征"></canvas>
    <button id="dash" type="button" aria-label="冲刺">冲刺</button>
    <div class="help">WASD / 方向键移动 · 自动射击 · Shift 冲刺 · Esc 暂停</div>
  </main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dashButton = document.getElementById("dash");
  const W = canvas.width;
  const H = canvas.height;

  const BEST_KEY = "riftDeluxeBest";
  const META_KEY = "riftDeluxeMeta";
  const keys = new Set();

  const zones = [
    { name: "曙光边境", subtitle: "标准航道 · 适合初次远征", startWave: 1, speed: 1, color: "#15264a" },
    { name: "霜环星域", subtitle: "寒冷裂隙 · 敌军移动稍快", startWave: 5, speed: 1.08, color: "#15334a" },
    { name: "赤焰星域", subtitle: "高危航道 · 敌军火力增强", startWave: 9, speed: 1.16, color: "#40213a" },
    { name: "幽影裂隙", subtitle: "深空禁区 · 高速敌人与首领", startWave: 13, speed: 1.25, color: "#2b1d49" },
    { name: "终焉回廊", subtitle: "极限挑战 · 祝你好运", startWave: 17, speed: 1.34, color: "#48202b" }
  ];

  const skillDefs = [
    { id: "hull", name: "强化船体", desc: "每级最大生命 +15", max: 5, cost: 1 },
    { id: "cannon", name: "聚焦火控", desc: "每级武器伤害 +10%", max: 5, cost: 1 },
    { id: "engine", name: "离子引擎", desc: "每级移动速度 +6%", max: 4, cost: 1 },
    { id: "shield", name: "护盾协议", desc: "每级初始护盾 +12", max: 5, cost: 1 },
    { id: "fortune", name: "星尘回收", desc: "每级商店初始星币 +15", max: 4, cost: 1 }
  ];

  let state = "title";
  let stateBeforeSkills = "title";
  let buttons = [];
  let stars = [];
  let enemies = [];
  let playerBullets = [];
  let enemyBullets = [];
  let pickups = [];
  let particles = [];
  let boss = null;

  let lastTime = 0;
  let elapsed = 0;
  let score = 0;
  let bestScore = loadBest();
  let zoneIndex = 0;
  let wave = 1;
  let nextWave = 1;
  let waveRemaining = 0;
  let spawnTimer = 0;
  let level = 1;
  let xp = 0;
  let xpNeeded = 30;
  let skillPoints = 0;
  let skillRanks = {};
  let upgrades = [];
  let scrap = 0;
  let shake = 0;
  let pointerDown = false;
  let pointerTarget = null;

  const player = {
    x: W / 2, y: H * 0.78, r: 16,
    speed: 300, hp: 100, maxHp: 100, shield: 0,
    invulnerable: 0, fireTimer: 0, fireRate: 0.30,
    damage: 1, shots: 1, pierce: 0,
    dashTimer: 0, dashCooldown: 0, magnet: 110
  };

  const upgradePool = [
    { title: "强化弹头", text: "武器伤害提高 35%", color: "#ffad78", apply: () => player.damage *= 1.35 },
    { title: "极速供能", text: "射击速度提高 20%", color: "#81e8ff", apply: () => player.fireRate = Math.max(.09, player.fireRate * .8) },
    { title: "双联炮管", text: "额外增加一枚侧向弹丸", color: "#ffe27a", apply: () => player.shots = Math.min(5, player.shots + 1) },
    { title: "相位弹", text: "弹丸额外穿透一个敌人", color: "#c5a1ff", apply: () => player.pierce = Math.min(5, player.pierce + 1) },
    { title: "强化装甲", text: "最大生命 +25，并恢复 25", color: "#8affbd", apply: () => { player.maxHp += 25; player.hp = Math.min(player.maxHp, player.hp + 25); } },
    { title: "能量护盾", text: "获得 45 点护盾", color: "#7deaff", apply: () => player.shield = Math.min(100, player.shield + 45) },
    { title: "离子引擎", text: "移动速度提高 12%", color: "#ff9ed6", apply: () => player.speed *= 1.12 },
    { title: "星尘磁场", text: "拾取范围扩大 45%", color: "#fff19b", apply: () => player.magnet += 50 }
  ];

  const shopItems = [
    { id: "damage", name: "军规弹头", desc: "永久提升本局伤害 25%", cost: 45, buy: () => player.damage *= 1.25 },
    { id: "rate", name: "超频组件", desc: "本局射速提高 15%", cost: 50, buy: () => player.fireRate = Math.max(.085, player.fireRate * .85) },
    { id: "repair", name: "船体维修", desc: "恢复 45 点生命", cost: 35, buy: () => player.hp = Math.min(player.maxHp, player.hp + 45) },
    { id: "shield", name: "护盾电池", desc: "获得 50 点护盾", cost: 40, buy: () => player.shield = Math.min(100, player.shield + 50) },
    { id: "barrel", name: "扩展炮架", desc: "增加一枚弹丸（最多 5 枚）", cost: 90, buy: () => player.shots = Math.min(5, player.shots + 1) }
  ];

  function safeRead(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value == null ? fallback : JSON.parse(value);
    } catch {
      return fallback;
    }
  }

  function loadBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch {
      return 0;
    }
  }

  function saveBest() {
    if (score <= bestScore) return;
    bestScore = Math.floor(score);
    try {
      localStorage.setItem(BEST_KEY, String(bestScore));
    } catch {}
  }

  function loadMeta() {
    const store = safeRead(META_KEY, {});
    const meta = store && typeof store === "object" ? store : {};

    skillPoints = Math.max(0, Number(meta.points) || 0);
    skillRanks = meta.ranks && typeof meta.ranks === "object" && !Array.isArray(meta.ranks)
      ? meta.ranks
      : {};

    for (const skill of skillDefs) {
      skillRanks[skill.id] = Math.max(
        0,
        Math.min(skill.max, Number(skillRanks[skill.id]) || 0)
      );
    }
  }

  function saveMeta() {
    try {
      localStorage.setItem(META_KEY, JSON.stringify({ points: skillPoints, ranks: skillRanks }));
    } catch {}
  }

  function skillRank(id) {
    return Number(skillRanks[id]) || 0;
  }

  function initStars() {
    stars = Array.from({ length: 130 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.7 + 0.3, speed: 12 + Math.random() * 36,
      alpha: 0.25 + Math.random() * 0.65
    }));
  }

  function resetGame(selectedZone) {
    zoneIndex = selectedZone;
    wave = zones[zoneIndex].startWave;
    nextWave = wave;
    elapsed = 0;
    score = 0;
    level = 1;
    xp = 0;
    xpNeeded = 30;
    shake = 0;
    boss = null;
    enemies = [];
    playerBullets = [];
    enemyBullets = [];
    pickups = [];
    particles = [];
    upgrades = [];
    scrap = 60 + skillRank("fortune") * 15;

    Object.assign(player, {
      x: W / 2, y: H * 0.78, r: 16,
      speed: 300 * (1 + skillRank("engine") * 0.06),
      hp: 100 + skillRank("hull") * 15,
      maxHp: 100 + skillRank("hull") * 15,
      shield: skillRank("shield") * 12,
      invulnerable: 0, fireTimer: 0, fireRate: 0.30,
      damage: 1 * (1 + skillRank("cannon") * 0.10),
      shots: 1, pierce: 0, dashTimer: 0, dashCooldown: 0, magnet: 110
    });

    state = "playing";
    startWave();
  }

  function startWave() {
    state = "playing";
    wave = nextWave;
    enemies = [];
    enemyBullets = [];
    boss = null;

    if (wave % 4 === 0) {
      spawnBoss();
    } else {
      waveRemaining = 5 + wave * 2;
      spawnTimer = 0.45;
    }
  }

  function makeEnemy(type) {
    const defs = {
      scout: { r: 13, hp: 2, speed: 105, reward: 12, color: "#ff837e" },
      chaser: { r: 16, hp: 3, speed: 84, reward: 18, color: "#ffc46b" },
      heavy: { r: 23, hp: 9, speed: 47, reward: 38, color: "#b695ff" },
      shooter: { r: 17, hp: 4, speed: 62, reward: 26, color: "#6ff0c0" }
    };
    const d = defs[type];
    const scale = zones[zoneIndex].speed;
    const hp = d.hp + Math.floor(wave * 0.25);

    return {
      type, x: 35 + Math.random() * (W - 70), y: -30 - Math.random() * 150,
      r: d.r, hp, maxHp: hp, speed: (d.speed + Math.min(wave * 2, 45)) * scale,
      reward: d.reward, color: d.color, phase: Math.random() * 6.28,
      fireTimer: 1.1 + Math.random() * 1.4, dead: false
    };
  }

  function spawnEnemy() {
    const r = Math.random();
    let type = "scout";
    if (wave >= 2 && r > 0.53) type = "chaser";
    if (wave >= 3 && r > 0.78) type = "shooter";
    if (wave >= 4 && r > 0.91) type = "heavy";
    enemies.push(makeEnemy(type));
  }

  function spawnBoss() {
    const hp = 190 + wave * 48;
    boss = {
      x: W / 2, y: -70, r: 44,
      hp, maxHp: hp,
      phase: 0, fireTimer: 1.3, warning: 0, attack: "fan",
      entry: true, dead: false
    };
  }

  function addParticles(x, y, color, count = 12, maxSpeed = 170) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 35 + Math.random() * maxSpeed;
      const life = 0.35 + Math.random() * 0.55;

      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life,
        maxLife: life,
        size: 2 + Math.random() * 3.5,
        color
      });
    }
  }

  function dropPickup(x, y, type) {
    pickups.push({
      x, y,
      r: 10,
      type,
      phase: Math.random() * 6.28,
      dead: false
    });
  }

  function circleHit(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    const r = a.r + b.r;
    return dx * dx + dy * dy <= r * r;
  }

  function shootPlayer() {
    const count = player.shots;
    for (let i = 0; i < count; i++) {
      const angle = (i - (count - 1) / 2) * 0.13;
      playerBullets.push({
        x: player.x,
        y: player.y - 17,
        vx: Math.sin(angle) * 90,
        vy: -520,
        r: 4.5,
        damage: player.damage,
        pierce: player.pierce,
        color: count > 1 ? "#ffe27a" : "#7deaff",
        dead: false
      });
    }
  }

  function dash() {
    if (state !== "playing" || player.dashCooldown > 0) return;
    player.dashTimer = 0.17;
    player.dashCooldown = 2.2;
    player.invulnerable = Math.max(player.invulnerable, 0.31);
    addParticles(player.x, player.y + 10, "#6deaff", 10, 100);
  }

  function damagePlayer(amount, x, y) {
    if (player.invulnerable > 0 || state !== "playing") return;

    let remaining = amount;
    if (player.shield > 0) {
      const absorbed = Math.min(player.shield, remaining);
      player.shield -= absorbed;
      remaining -= absorbed;
    }

    if (remaining > 0) {
      player.hp -= remaining;
      player.invulnerable = 0.55;
      addParticles(x, y, "#ff7189", 14, 150);
      shake = 7;
    }

    if (player.hp <= 0) {
      player.hp = 0;
      state = "gameover";
      saveBest();
    }
  }

  function chooseUpgrade() {
    const pool = [...upgradePool];
    upgrades = [];
    while (upgrades.length < 3 && pool.length) {
      upgrades.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    state = "upgrade";
  }

  function selectUpgrade(index) {
    if (state !== "upgrade" || !upgrades[index]) return;
    upgrades[index].apply();
    addParticles(player.x, player.y, upgrades[index].color, 22, 120);
    upgrades = [];
    state = "playing";
    checkLevelUp();
  }

  function checkLevelUp() {
    if (state !== "playing" || xp < xpNeeded) return;
    xp -= xpNeeded;
    level++;
    xpNeeded = Math.floor(xpNeeded * 1.3 + 10);
    chooseUpgrade();
  }

  function fireEnemyBullet(x, y, vx, vy, damage = 10, r = 6) {
    enemyBullets.push({ x, y, vx, vy, damage, r, dead: false });
  }

  function completeWave(wasBoss) {
    if (state !== "playing") return;

    const reward = 25 + wave * 8 + (wasBoss ? 80 : 0);
    scrap += reward;
    score += wasBoss ? 500 + wave * 25 : 100 + wave * 10;

    if (wasBoss) {
      skillPoints += 1;
      saveMeta();
    }

    nextWave = wave + 1;
    state = "shop";
    saveBest();
  }

  function killEnemy(enemy) {
    if (enemy.dead) return;
    enemy.dead = true;
    score += enemy.reward;
    xp += enemy.type === "heavy" ? 9 : 5;
    addParticles(enemy.x, enemy.y, enemy.color, 15, 140);

    if (Math.random() < 0.17) {
      dropPickup(enemy.x, enemy.y, Math.random() < 0.72 ? "xp" : "shield");
    }
  }

  function killBoss() {
    if (!boss || boss.dead) return;
    const x = boss.x;
    const y = boss.y;
    boss.dead = true;
    addParticles(x, y, "#ffd777", 60, 260);
    dropPickup(x, y, "shield");
    boss = null;
    completeWave(true);
  }

  function updatePlayer(dt) {
    let dx = 0;
    let dy = 0;

    if (keys.has("arrowleft") || keys.has("a")) dx--;
    if (keys.has("arrowright") || keys.has("d")) dx++;
    if (keys.has("arrowup") || keys.has("w")) dy--;
    if (keys.has("arrowdown") || keys.has("s")) dy++;

    if (pointerDown && pointerTarget) {
      const tx = pointerTarget.x - player.x;
      const ty = pointerTarget.y - player.y;
      const d = Math.hypot(tx, ty);
      if (d > 5) {
        dx = tx / d;
        dy = ty / d;
      } else {
        dx = 0;
        dy = 0;
      }
    }

    const len = Math.hypot(dx, dy) || 1;
    const speed = player.speed * (player.dashTimer > 0 ? 2.45 : 1);

    player.x += (dx / len) * speed * dt;
    player.y += (dy / len) * speed * dt;
    player.x = Math.max(player.r + 6, Math.min(W - player.r - 6, player.x));
    player.y = Math.max(player.r + 6, Math.min(H - player.r - 6, player.y));

    player.fireTimer -= dt;
    player.dashTimer = Math.max(0, player.dashTimer - dt);
    player.dashCooldown = Math.max(0, player.dashCooldown - dt);
    player.invulnerable = Math.max(0, player.invulnerable - dt);

    if (player.fireTimer <= 0) {
      shootPlayer();
      player.fireTimer = player.fireRate;
    }
  }

  function updateWave(dt) {
    if (state !== "playing") return;

    if (wave % 4 === 0) {
      if (boss) return;
      return;
    }

    if (waveRemaining > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        waveRemaining--;
        spawnTimer = Math.max(0.22, 0.72 - wave * 0.012);
      }
    } else if (enemies.length === 0) {
      completeWave(false);
    }
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      if (e.dead) continue;

      e.phase += dt * 2.2;

      if (e.type === "chaser") {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed * dt;
        e.y += Math.sin(a) * e.speed * dt;
      } else {
        e.y += e.speed * dt;
        e.x += Math.sin(e.phase) * (e.type === "heavy" ? 22 : 42) * dt;
      }

      if (e.type === "shooter") {
        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && e.y > 0 && e.y < H * 0.7) {
          e.fireTimer = 1.7 + Math.random() * 0.8;
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          const scale = zones[zoneIndex].speed;
          fireEnemyBullet(e.x, e.y + 8, Math.cos(a) * 185 * scale, Math.sin(a) * 185 * scale, 9, 6);
        }
      }

      if (e.y > H + 50) e.dead = true;

      if (!e.dead && circleHit(e, player)) {
        e.dead = true;
        damagePlayer(e.type === "heavy" ? 22 : 14, e.x, e.y);
      }
    }

    enemies = enemies.filter(e => !e.dead);
  }

  function bossAttack() {
    if (!boss) return;

    const speed = 205 * zones[zoneIndex].speed * (boss.hp < boss.maxHp * 0.5 ? 1.18 : 1);
    const aim = Math.atan2(player.y - boss.y, player.x - boss.x);

    if (boss.attack === "fan") {
      for (let i = -3; i <= 3; i++) {
        const a = aim + i * 0.16;
        fireEnemyBullet(boss.x, boss.y + 20, Math.cos(a) * speed, Math.sin(a) * speed, 12, 7);
      }
    } else if (boss.attack === "ring") {
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12 + boss.phase;
        fireEnemyBullet(boss.x, boss.y, Math.cos(a) * speed * 0.78, Math.sin(a) * speed * 0.78, 11, 6);
      }
    } else if (boss.attack === "aim") {
      for (let i = -1; i <= 1; i++) {
        const a = aim + i * 0.11;
        fireEnemyBullet(boss.x, boss.y + 20, Math.cos(a) * speed * 1.18, Math.sin(a) * speed * 1.18, 15, 7);
      }
    } else {
      // summon
      for (let i = 0; i < 2; i++) {
        const e = makeEnemy("chaser");
        e.x = boss.x + (i ? 60 : -60);
        e.y = boss.y + 20;
        enemies.push(e);
      }
    }
  }

  function updateBoss(dt) {
    if (!boss) return;

    boss.phase += dt;

    if (boss.entry) {
      boss.y += 95 * dt;
      if (boss.y >= 95) boss.entry = false;
    } else {
      boss.x = W / 2 + Math.sin(boss.phase * 0.78) * 300;
      boss.y = 95 + Math.sin(boss.phase * 1.6) * 18;
      boss.fireTimer -= dt;

      if (boss.warning > 0) {
        boss.warning -= dt;
        if (boss.warning <= 0) {
          bossAttack();
          boss.fireTimer = boss.hp < boss.maxHp * 0.5 ? 0.68 : 1.05;
        }
      } else if (boss.fireTimer <= 0) {
        const patterns = boss.hp < boss.maxHp * 0.5 ? ["fan", "ring", "aim", "summon"] : ["fan", "ring", "aim"];
        boss.attack = patterns[Math.floor(Math.random() * patterns.length)];
        boss.warning = 0.72;
      }
    }

    if (circleHit({ x: boss.x, y: boss.y, r: boss.r }, player)) {
      damagePlayer(25, boss.x, boss.y);
    }
  }

  function updateBullets(dt) {
    for (const b of playerBullets) {
      if (b.dead) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.x < -40 || b.x > W + 40 || b.y < -50) b.dead = true;

      for (const e of enemies) {
        if (b.dead || e.dead) continue;
        if (circleHit(b, e)) {
          e.hp -= b.damage;
          addParticles(b.x, b.y, b.color, 3, 70);

          if (e.hp <= 0) killEnemy(e);

          if (b.pierce > 0) b.pierce--;
          else b.dead = true;
        }
      }

      if (boss && !b.dead && circleHit(b, boss)) {
        boss.hp -= b.damage;
        addParticles(b.x, b.y, "#ffc4df", 3, 75);

        if (boss.hp <= 0) killBoss();

        if (b.pierce > 0) b.pierce--;
        else b.dead = true;
      }
    }
    playerBullets = playerBullets.filter(b => !b.dead);

    for (const b of enemyBullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.x < -35 || b.x > W + 35 || b.y < -35 || b.y > H + 35) b.dead = true;
      if (!b.dead && circleHit(b, player)) {
        b.dead = true;
        damagePlayer(b.damage, b.x, b.y);
      }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead);
  }

  function updatePickups(dt) {
    for (const p of pickups) {
      if (p.dead) continue;
      p.phase += dt * 3;
      const dx = player.x - p.x;
      const dy = player.y - p.y;
      const d = Math.hypot(dx, dy);

      if (d < player.magnet && d > 1) {
        const pull = 150 + (player.magnet - d) * 2;
        p.x += (dx / d) * pull * dt;
        p.y += (dy / d) * pull * dt;
      } else {
        p.y += 25 * dt;
      }

      if (d < p.r + player.r + 3) {
        if (p.type === "xp") {
          xp += 10;
          score += 5;
          addParticles(p.x, p.y, "#ffe27a", 9, 90);
        } else {
          player.shield = Math.min(100, player.shield + 35);
          addParticles(p.x, p.y, "#7deaff", 12, 100);
        }
        p.dead = true;
      }

      if (p.y > H + 30) p.dead = true;
    }

    pickups = pickups.filter(p => !p.dead);
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function update(dt) {
    for (const s of stars) {
      s.y += s.speed * dt;
      if (s.y > H + 3) {
        s.y = -3;
        s.x = Math.random() * W;
      }
    }
    shake = Math.max(0, shake - dt * 24);

    if (state !== "playing") return;

    elapsed += dt;
    score += dt * 2;
    updatePlayer(dt);
    updateWave(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateParticles(dt);
    checkLevelUp();
    saveBest();
  }

  function roundedPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function button(x, y, w, h, label, action, options = {}) {
    buttons.push({ x, y, w, h, action });

    roundedPath(x, y, w, h, options.radius || 10);

    ctx.fillStyle = options.fill || "#162642";
    ctx.fill();
    ctx.strokeStyle = options.stroke || "#6bcdf477";
    ctx.lineWidth = options.lineWidth || 1.5;
    ctx.stroke();

    ctx.fillStyle = options.text || "#eff8ff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = options.font || "bold 16px system-ui";
    ctx.fillText(label, x + w / 2, y + h / 2);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  function drawBackground() {
    const zone = zones[zoneIndex] || zones[0];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, zone.color);
    g.addColorStop(1, "#080b17");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const nebula = ctx.createRadialGradient(W * 0.72, H * 0.42, 10, W * 0.72, H * 0.42, 430);
    nebula.addColorStop(0, "#3b4ea622");
    nebula.addColorStop(1, "#111b3000");
    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = "#e3edff";
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    if (player.invulnerable > 0 && Math.floor(player.invulnerable * 16) % 2 === 0) {
      ctx.globalAlpha = 0.38;
    }

    ctx.save();
    ctx.translate(player.x, player.y);

    if (player.shield > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, player.r + 10 + Math.sin(elapsed * 7) * 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = "#75eaff";
      ctx.lineWidth = 2.5;
      ctx.shadowColor = "#48dfff";
      ctx.shadowBlur = 18;
      ctx.stroke();
    }

    ctx.shadowColor = "#66ddff";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#e5f6ff";
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(17, 15);
    ctx.lineTo(0, 9);
    ctx.lineTo(-17, 15);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#64cbff";
    ctx.beginPath();
    ctx.ellipse(0, -3, 5, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffb775";
    ctx.beginPath();
    ctx.moveTo(-5, 14);
    ctx.lineTo(0, 25 + Math.random() * 4);
    ctx.lineTo(5, 14);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 12;

    if (e.type === "scout") {
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-10, -10, 20, 20);
    } else if (e.type === "chaser") {
      ctx.beginPath();
      ctx.moveTo(0, -17);
      ctx.lineTo(15, 12);
      ctx.lineTo(0, 7);
      ctx.lineTo(-15, 12);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "heavy") {
      roundedPath(-e.r, -e.r, e.r * 2, e.r * 2, 6);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#eafff8";
      ctx.fillRect(-3, -9, 6, 18);
    }

    ctx.restore();

    if (e.hp < e.maxHp) {
      const width = e.r * 2;
      ctx.fillStyle = "#0008";
      ctx.fillRect(e.x - e.r, e.y - e.r - 9, width, 4);
      ctx.fillStyle = "#8bffc2";
      ctx.fillRect(e.x - e.r, e.y - e.r - 9, width * Math.max(0, e.hp / e.maxHp), 4);
    }
  }

  function drawBoss() {
    if (!boss) return;

    ctx.save();
    ctx.translate(boss.x, boss.y);
    ctx.shadowColor = boss.warning > 0 ? "#fff08a" : "#ff5d9d";
    ctx.shadowBlur = boss.warning > 0 ? 30 : 24;
    ctx.fillStyle = boss.warning > 0 ? "#f47b9a" : "#d94c83";
    ctx.beginPath();
    ctx.moveTo(0, -boss.r);
    ctx.lineTo(boss.r, -10);
    ctx.lineTo(boss.r * 0.72, boss.r * 0.78);
    ctx.lineTo(0, boss.r * 0.5);
    ctx.lineTo(-boss.r * 0.72, boss.r * 0.78);
    ctx.lineTo(-boss.r, -10);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffe4f0";
    ctx.fillRect(-19, -10, 10, 8);
    ctx.fillRect(9, -10, 10, 8);
    ctx.fillStyle = "#ff9aba";
    ctx.fillRect(-7, 9, 14, 7);
    ctx.restore();

    const bw = 340;
    const bx = (W - bw) / 2;
    const by = 18;

    ctx.fillStyle = "#140c1cdd";
    ctx.fillRect(bx - 3, by - 3, bw + 6, 20);
    ctx.fillStyle = "#38142a";
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = "#ff5791";
    ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 14);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe7f1";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(
      boss.warning > 0
        ? `预警：${boss.attack === "ring" ? "环形弹幕" : boss.attack === "summon" ? "召唤增援" : "锁定攻击"}`
        : "裂隙守卫",
      W / 2,
      by + 11
    );
    ctx.textAlign = "left";
  }

  function drawBullets() {
    for (const b of playerBullets) {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r, b.r * 1.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const b of enemyBullets) {
      ctx.fillStyle = "#ff7297";
      ctx.shadowColor = "#ff396d";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawPickups() {
    for (const p of pickups) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.phase) * 0.2);
      ctx.shadowBlur = 15;

      if (p.type === "shield") {
        ctx.shadowColor = "#70eaff";
        ctx.fillStyle = "#83edff";
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#12405a";
        ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("S", 0, 1);
      } else {
        ctx.shadowColor = "#ffe77b";
        ctx.fillStyle = "#ffe77b";
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 5;
          const rr = i % 2 ? p.r * 0.45 : p.r;
          const x = Math.cos(a) * rr;
          const y = Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function bar(x, y, w, h, ratio, color) {
    ctx.fillStyle = "#ffffff20";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h);
  }

    if (player.shield > 0) {
      ctx.fillStyle = "#84ebff";

    ctx.textAlign = "right";

    ctx.fillText(player.dashCooldown <= 0 ? "冲刺就绪" : `冲刺 ${player.dashCooldown.toFixed(1)}s`, W - 25, 30);
    ctx.textAlign = "left";
  }

  function wrapText(text, centerX, y, maxWidth, lineHeight) {
    const lines = [];
    let current = "";

    for (const ch of text) {
      const test = current + ch;
      if (ctx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);

    lines.forEach((line, i) => {
      ctx.fillText(line, centerX, y + i * lineHeight);
    });
  }

  function drawSkills() {
    ctx.fillStyle = "#030714e0";

    ctx.textAlign = "center";
    ctx.fillStyle = "#f4fbff";
    ctx.font = "bold 34px system-ui";
    ctx.fillText("远征技能树", W / 2, 75);

    ctx.fillStyle = "#ffd979";
    ctx.font = "bold 17px system-ui";
    ctx.fillText(`可用技能点：${skillPoints}`, W / 2, 108);

    const cw = 300;
    const ch = 75;
    const gap = 14;
    const sx = 185;
    const sy = 140;

    skillDefs.forEach((s, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = sx + col * (cw + gap);
      const y = sy + row * (ch + 12);

      ctx.fillStyle = "#111c32";
      ctx.fill();

      ctx.stroke();

      ctx.textAlign = "left";
      ctx.fillStyle = "#eff8ff";
      ctx.font = "bold 15px system-ui";
      ctx.fillText(`${s.name}  ${rank}/${s.max}`, x + 14, y + 23);

      ctx.fillStyle = "#aebfdd";
      ctx.font = "12px system-ui";
      ctx.fillText(s.desc, x + 14, y + 48);

      button(x + cw - 86, y + 20, 72, 36, rank >= s.max ? "已满级" : `升级 ${s.cost}`, () => {
        if (rank < s.max && skillPoints >= s.cost) {
          skillPoints -= s.cost;
          skillRanks[s.id] = rank + 1;
          saveMeta();
          draw();
        }
      }, { font: "bold 12px system-ui", fill: "#1a2e49" });
    });

    const returnLabel = stateBeforeSkills === "shop" ? "返回补给站" : "返回主菜单";
    button(390, 490, 220, 46, returnLabel, () => {
      state = stateBeforeSkills === "shop" ? "shop" : "title";
    }, { fill: "#1a2e49" });

    ctx.textAlign = "center";
    ctx.fillStyle = "#9fb3d5";
    ctx.font = "12px system-ui";
    ctx.fillText("击败首领获得技能点。技能效果会在下一次出发时生效。", W / 2, 555);
    ctx.textAlign = "left";
  }

  function openSkills() {
    stateBeforeSkills = state;
    state = "skills";
  }

  function drawGameOver() {
    drawOverlay("远征结束", `在${zones[zoneIndex].name}抵达第 ${wave} 波`, "选择重新出发或返回主菜单");

    button(285, 430, 190, 46, "重新开始", () => resetGame(zoneIndex), { fill: "#173958", font: "bold 16px system-ui" });
    button(525, 430, 190, 46, "主菜单", () => state = "title", { fill: "#1a2e49", font: "bold 16px system-ui" });
  }

  function draw() {
    buttons = [];
    ctx.save();

    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    drawPickups();
    drawBullets();
    for (const e of enemies) drawEnemy(e);
    drawBoss();
    drawParticles();

    if (state !== "title" && state !== "select" && state !== "skills" && state !== "controls") {
      drawPlayer();
    }

    if (["playing", "paused", "upgrade", "shop", "gameover"].includes(state)) {
      drawHud();
    }

    ctx.restore();

    if (state === "title") drawTitle();
    else if (state === "select") drawSelect();
    else if (state === "controls") drawControls();
    else if (state === "upgrade") drawUpgrade();
    else if (state === "shop") drawShop();
    else if (state === "skills") drawSkills();
    else if (state === "paused") {
      drawOverlay("暂停", "按 Esc 或空格继续。", "宇宙暂时等你一下。");
      button(390, 420, 220, 46, "继续游戏", () => state = "playing", { fill: "#173958", font: "bold 16px system-ui" });
    } else if (state === "gameover") drawGameOver();
  }

  function canvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * W / rect.width,
      y: (e.clientY - rect.top) * H / rect.height
    };
  }

  function handleCanvasClick(point) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (point.x >= b.x && point.x <= b.x + b.w && point.y >= b.y && point.y <= b.y + b.h) {
        b.action();
        return true;
      }
    }
    return false;
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const point = canvasPoint(e);

    if (state === "playing") {
      pointerDown = true;
      pointerTarget = point;
      return;
    }

    handleCanvasClick(point);
  });

  canvas.addEventListener("pointermove", e => {
    if (pointerDown && state === "playing") pointerTarget = canvasPoint(e);
  });

  function releasePointer() {
    pointerDown = false;
    pointerTarget = null;
  }

  canvas.addEventListener("pointerup", releasePointer);
  canvas.addEventListener("pointercancel", releasePointer);
  canvas.addEventListener("lostpointercapture", releasePointer);

  dashButton.addEventListener("pointerdown", e => {
    e.preventDefault();
    e.stopPropagation();
    dash();
  });

  function handleKeyDown(e) {
    const rawKey = e.key;
    const key = e.code === "Space" ? " " : rawKey.toLowerCase();

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "shift", "escape"].includes(key)) {
      e.preventDefault();
    }

    keys.add(key);

    if ((key === " " || e.code === "Space") && (state === "title" || state === "gameover")) {
      state = "select";
      return;
    }

    if ((key === " " || e.code === "Space") && state === "paused") {
      state = "playing";
      return;
    }

    if (key === "escape") {
      if (state === "playing") state = "paused";
      else if (state === "paused") state = "playing";
      else if (state === "skills") state = stateBeforeSkills;
      else if (state === "select" || state === "controls") state = "title";
      else if (state === "shop") startWave();
    }

    if (key === "shift") dash();

    if (state === "upgrade" && ["1", "2", "3"].includes(key)) {
      selectUpgrade(Number(key) - 1);
    }

    if (state === "select" && ["1", "2", "3", "4", "5"].includes(key)) {
      resetGame(Number(key) - 1);
    }
  }

  window.addEventListener("keydown", handleKeyDown);
  window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  window.addEventListener("blur", () => keys.clear());

  function frame(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  loadMeta();
  initStars();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
